<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vårt Escape Room</title>
    <!-- Her hentes alt utseendet! -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <!-- ========================================== -->
    <!-- START: VELKOMMENSKJERM                     -->
    <!-- ========================================== -->
    <div id="screen-start" class="screen active">
        <h1>Velkommen til Escape Room!</h1>
        <p>Laget deres er låst inne. Dere må løse oppgavene for å komme ut.</p>
        <button onclick="goToScreen('screen-task1')">Start spillet</button>
    </div>

    <!-- ========================================== -->
    <!-- OPPGAVE 1: OSLO                            -->
    <!-- ========================================== -->
    <div id="screen-task1" class="screen">
        <h2>Oppgave 1</h2>
        <p>Hvilket ord får du hvis du stokker om bokstavene i ordet "S-L-O-O"?</p>
        <!-- Inndatafelt for spilleren -->
        <input type="text" id="task1-input" placeholder="Skriv svaret her">
        <button onclick="validateTask1()">Sjekk svar</button>
        <!-- Feilmelding som er skjult som standard -->
        <p id="task1-error" style="color:red; display:none;">Feil kode, prøv igjen!</p>
    </div>

    <!-- ========================================== -->
    <!-- OPPGAVE 2: KRYPTOGRAFI                     -->
    <!-- ========================================== -->


    <!-- ========================================== -->
    <!-- OPPGAVE 3: TIMEGLASSET                     -->
    <!-- ========================================== -->


    <script src="script.js"></script>
</body>
</html>
